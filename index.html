<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spotify Remote</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1db954" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <!-- iOS "Add to Home Screen": fullscreen standalone launch, no Safari chrome -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Remote" />

  <!-- Applied before first paint so a customised appearance never flashes
       the default one on load. js/theme.js persists the *resolved* token
       map alongside the settings precisely so this can stay a dumb loop
       with none of the colour maths duplicated in it. -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("spotify_remote_appearance") || "null");
        if (!saved || !saved.tokens) return;
        var root = document.documentElement;
        for (var name in saved.tokens) {
          if (Object.prototype.hasOwnProperty.call(saved.tokens, name)) {
            root.style.setProperty(name, saved.tokens[name]);
          }
        }
        root.setAttribute(
          "data-buttons",
          saved.settings && saved.settings.buttons === "glass" ? "glass" : "solid"
        );
      } catch (e) {
        // No saved appearance, or storage unavailable — the stylesheet
        // defaults cover it.
      }
    })();
  </script>

  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
